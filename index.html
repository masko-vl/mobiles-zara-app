<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zara Challenge · Smartphones</title>
    <style>
      /* Pre-React boot state (Figma "Unloaded"): white canvas with the navbar
         chrome at the same sizes as the real navbar (logo 74x28, left 100/40/16).
         React replaces this content as soon as it mounts. */
      body {
        margin: 0;
        font-family: Helvetica, Arial, sans-serif;
      }
      .boot-canvas {
        background: #fff;
        min-height: 100vh;
      }
      .boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 100px 24px;
      }
      .boot-logo {
        width: 74px;
        height: 28px;
      }
      .boot-cart {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 16px;
        color: #000;
      }
      @media (max-width: 1023px) {
        .boot-header {
          padding: 28px 40px 24px;
        }
      }
      @media (max-width: 767px) {
        .boot-header {
          padding: 28px 16px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-canvas">
        <header class="boot-header">
          <img src="/logo.png" alt="" width="74" height="28" class="boot-logo" />
          <span class="boot-cart">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 8h14l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8Z" />
              <path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10" />
            </svg>
            0
          </span>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
