<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zara Challenge · Smartphones</title>
    <style>
      /* Pre-React boot state (Figma "Unloaded"): white canvas with the navbar
         chrome. React replaces this content as soon as it mounts. */
      body {
        margin: 0;
        background: #f4f4f4;
        font-family: Helvetica, Arial, sans-serif;
      }
      .boot-canvas {
        background: #fff;
        margin: 0 48px;
        min-height: 100vh;
      }
      .boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 48px 8px;
      }
      .boot-logo {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #141414;
      }
      .boot-cart {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 14px;
        color: #141414;
      }
      @media (max-width: 1023px) {
        .boot-canvas {
          margin: 0 24px;
        }
        .boot-header {
          padding: 24px 32px 8px;
        }
      }
      @media (max-width: 767px) {
        .boot-canvas {
          margin: 0 8px;
        }
        .boot-header {
          padding: 24px 16px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-canvas">
        <header class="boot-header">
          <span class="boot-logo" aria-hidden="true">M✱BST</span>
          <span class="boot-cart">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 8h14l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8Z" />
              <path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10" />
            </svg>
            0
          </span>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
